apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  interval: 24h0m0s
  path: ./apps/talos
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: infrastructure
    - name: secrets
  patches:
    - target:
        group: networking.k8s.io
        version: v1
        kind: Ingress
        labelSelector: hilmargustafs.com/group=internal
      patch: |-
        - op: add
          path: /metadata/annotations/tailscale.com~1tags
          value: "tag:k8s,tag:internal"
    # MA proxy carries its own dedicated tag so the ACL can scope the router to
    # exactly one node. The internal patch above has already set the annotation
    # (runs first), so this REPLACES the value with media appended.
    - target:
        group: networking.k8s.io
        version: v1
        kind: Ingress
        labelSelector: hilmargustafs.com/media=true
      patch: |-
        - op: replace
          path: /metadata/annotations/tailscale.com~1tags
          value: "tag:k8s,tag:internal,tag:media"
    # MA L3 stream Service carries its own node (music-assistant-stream) that the
    # router must peer to relay audio to the Cast speakers. Scope tag:media to it
    # the same way the L7 Ingress node is tagged, so the narrow [tag:router ->
    # tag:media] ACL keeps working for the stream path too.
    - target:
        group: "" # core resources use the empty API group, not "core"
        version: v1
        kind: Service
        labelSelector: hilmargustafs.com/media=true
      patch: |-
        - op: add
          path: /metadata/annotations/tailscale.com~1tags
          value: "tag:k8s,tag:internal,tag:media"
