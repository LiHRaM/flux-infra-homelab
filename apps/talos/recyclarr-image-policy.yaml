---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImagePolicy
metadata:
  name: recyclarr
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: recyclarr
  policy:
    semver:
      # v8 migration (2026-10-08): the config is now guide-backed, which does
      # not need `replace_existing_custom_formats` (removed in v8). The old 7.x
      # cap existed only to avoid that migration; it is no longer needed.
      range: '>=8.0.0 <9.0.0'
