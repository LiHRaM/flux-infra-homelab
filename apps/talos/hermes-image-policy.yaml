---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImagePolicy
metadata:
  name: hermes
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: hermes
  # Nous publishes moving tags (main, latest, main-desktop, latest-desktop)
  # alongside dated releases. The pattern keeps only the dated vYYYY.M.D tags
  # and the semver range skips the -desktop image variants, so Flux tracks
  # releases and never jumps onto a moving tag.
  filterTags:
    pattern: '^v(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'
    extract: '$version'
  policy:
    semver:
      range: '>=2026.9.0'
