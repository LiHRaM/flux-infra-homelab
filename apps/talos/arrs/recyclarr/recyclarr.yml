# yaml-language-server: $schema=https://schemas.recyclarr.dev/v8/config-schema.json
#
# Recyclarr v8 config (migrated from the v7 include-template form, 2026-10-08).
#
# v8 removed every official include template and replaced them with
# guide-backed quality profiles + custom-format groups. The `include:` block is
# gone; `replace_existing_custom_formats` is gone (v8 adopts existing custom
# formats by name automatically). Upstream `config-templates` master is the v8
# form (there is no `v8` branch and no v7 branch: v7 lived on `master`).

sonarr:

  web-1080p-v4:
    base_url: !secret sonarr_url
    api_key: !secret sonarr_apikey

    delete_old_custom_formats: true

    # Guide-backed profile: pulls qualities, score set and CF scores from the
    # TRaSH Guides ("WEB-1080p (Alternative)" = 720p + 1080p, WEB/Bluray/HDTV,
    # no Remux).
    # `name` is kept ONLY so the first sync ADOPTS the existing "WEB-1080p"
    # profile instead of creating a duplicate. After adoption it can be removed
    # to take the guide name "WEB-1080p (Alternative)".
    quality_profiles:
      - trash_id: 9d142234e45d6143785ac55f5a9e8dc9  # WEB-1080p (Alternative)
        name: WEB-1080p
        reset_unmatched_scores:
          enabled: true

    # Sizes are MB per minute of runtime, so per-episode totals scale with
    # episode length. At 45 min: preferred ~0.8 GB, max ~2.0 GB; at 60 min:
    # preferred ~1.1 GB, max ~2.7 GB. min is a permissive floor, not a target.
    quality_definition:
      type: series
      qualities:
        - name: WEBDL-1080p
          min: 3
          preferred: 18
          max: 45
        - name: WEBRip-1080p
          min: 3
          preferred: 18
          max: 45
        - name: HDTV-1080p
          min: 3
          preferred: 18
          max: 45
        - name: Bluray-1080p
          min: 3
          preferred: 18
          max: 45
        - name: WEBDL-720p
          min: 2
          preferred: 12
          max: 35
        - name: WEBRip-720p
          min: 2
          preferred: 12
          max: 35
        - name: HDTV-720p
          min: 2
          preferred: 12
          max: 35
        - name: Bluray-720p
          min: 2
          preferred: 12
          max: 35

    # Default guide CF groups sync automatically with a guide-backed profile.
    # This block only restores the opt-in [Unwanted] formats that the v7 config
    # scored explicitly. Bad Dual Groups is default-included already.
    custom_format_groups:
      add:
        - trash_id: 59c3af66780d08332fdc64e68297098f  # [Unwanted] Unwanted Formats
          select:
            - 82d40da2bc6923f41e14394075dd4b03  # No-RlsGroup
            - e1a997ddb54e3ecbfe06341ad323c458  # Obfuscated
            - 06d66ab109d4d2eddb2794d21526d140  # Retags
            - 1b3994c551cbb92a2c781af061f4ab44  # Scene

radarr:
  main:
    base_url: !secret radarr_url
    api_key: !secret radarr_apikey

    delete_old_custom_formats: true

    # Guide-backed profile: TRaSH "HD Bluray + WEB" (Bluray-1080p + WEB 1080p +
    # Bluray-720p; no Remux/2160p). `name` kept for the adopting first sync.
    quality_profiles:
      - trash_id: d1d67249d3890e49bc12e275d989a7e9  # HD Bluray + WEB
        name: HD Bluray + WEB
        reset_unmatched_scores:
          enabled: true

    # Sizes are MB per minute of runtime, so totals scale with film length.
    # At 115 min: preferred ~1.5 GB, max ~3.45 GB; at 90 min: preferred ~1.2 GB,
    # max ~2.7 GB. min is a permissive floor so good 720p files aren't rejected.
    quality_definition:
      type: movie
      qualities:
        - name: Bluray-1080p
          min: 3
          preferred: 13
          max: 30
        - name: WEBDL-1080p
          min: 3
          preferred: 13
          max: 30
        - name: WEBRip-1080p
          min: 3
          preferred: 13
          max: 30
        - name: Bluray-720p
          min: 2
          preferred: 10
          max: 25

    # Default guide CF groups sync automatically. This block only restores the
    # opt-in [Unwanted] formats that the v7 config scored explicitly.
    # NOTE on x265 (HD): the v7 static template scored it negative; the v8 guide
    # does not — no default group for this profile touches it, and
    # reset_unmatched_scores pins unmatched formats to 0, so HEVC stays allowed
    # without an explicit override.
    custom_format_groups:
      add:
        - trash_id: a3ac6af01d78e4f21fcb75f601ac96df  # [Unwanted] Unwanted Formats
          select:
            - ae9b7c9ebde1f3bd336a8cbd1ec4c5e5  # No-RlsGroup
            - 7357cf5161efbf8c4d5d0c30b4815ee2  # Obfuscated
            - 5c44f52a8714fdd79bb4d98e2673be1f  # Retags
            - f537cf427b64c38c8e36298f657e4828  # Scene
