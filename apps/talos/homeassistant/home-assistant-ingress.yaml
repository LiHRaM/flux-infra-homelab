apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: home-assistant
  namespace: smarthome
  labels:
    hilmargustafs.com/group: internal
spec:
  defaultBackend:
    service:
      name: home-assistant
      port:
        number: 8123
  ingressClassName: tailscale
  tls:
    - hosts:
        - home-assistant
