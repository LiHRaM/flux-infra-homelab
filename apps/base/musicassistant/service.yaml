apiVersion: v1
kind: Service
metadata:
  name: music-assistant
  namespace: smarthome
spec:
  ports:
    - name: http
      port: 8095
      targetPort: 8095
    - name: stream
      port: 8097
      targetPort: 8097
    - name: stream-http
      port: 80
      targetPort: 80
    - name: sendspin
      port: 8927
      targetPort: 8927
  selector:
    app: music-assistant
