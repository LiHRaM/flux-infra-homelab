apiVersion: v1
kind: ConfigMap
metadata:
  name: home-assistant-config
  namespace: smarthome
data:
  configuration.yaml: |
    # Reverse proxy handling: the tailscale ts-ingress sidecar terminates TLS
    # and forwards plain HTTP with X-Forwarded-* headers. By default HA rejects
    # requests with forwarded headers from an untrusted IP (HTTP 400
    # "not set-up for reverse proxies"). Trust the whole flannel pod CIDR so the
    # proxy can pass them regardless of its per-pod IP.
    http:
      use_x_forwarded_for: true
      trusted_proxies:
        - 127.0.0.1
        - ::1
        - 10.244.0.0/16
