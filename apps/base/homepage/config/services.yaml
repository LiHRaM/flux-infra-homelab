- Downloads:
    - qbittorrent:
        href: https://qbittorrent.tyrannosaurus-turtle.ts.net
        description: "Download client"
        icon: qbittorrent.png
        siteMonitor: https://qbittorrent.tyrannosaurus-turtle.ts.net
        widget:
            type: qbittorrent
            url: http://qbittorrent.qbittorrent.svc.cluster.local:8080
            username: "admin"
            password: "{{HOMEPAGE_VAR_QBITTORRENT_PASSWORD}}"
- Smart Home:
    - home-assistant:
        href: https://home-assistant.tyrannosaurus-turtle.ts.net
        description: "Home automation"
        icon: home-assistant.png
        siteMonitor: https://home-assistant.tyrannosaurus-turtle.ts.net
        widget:
            type: homeassistant
            url: http://home-assistant.smarthome.svc.cluster.local:8123
            key: "{{HOMEPAGE_VAR_HOMEASSISTANT_TOKEN}}"
    - music-assistant:
        href: https://music-assistant.tyrannosaurus-turtle.ts.net
        description: "Multi-room audio"
        icon: music-assistant.png
        siteMonitor: https://music-assistant.tyrannosaurus-turtle.ts.net
- Infrastructure:
    - ntfy:
        href: https://ntfy.tyrannosaurus-turtle.ts.net
        description: "Notifications"
        icon: ntfy.png
        siteMonitor: https://ntfy.tyrannosaurus-turtle.ts.net
        # NOTE: no ntfy widget. homepage v2.6.0 hardcodes the endpoint
        # "{topic}/json?poll=1&since=latest", but ntfy 1.28 rejects
        # since=latest with HTTP 400 (it only accepts a duration like 1h).
        # The endpoint is not configurable, so the widget cannot work here
        # until upstream fixes it. Kept as a plain link for now.
    - longhorn:
        href: https://longhorn.tyrannosaurus-turtle.ts.net
        description: "Block storage"
        icon: longhorn.png
        siteMonitor: https://longhorn.tyrannosaurus-turtle.ts.net
    - hermes:
        href: https://hermes.tyrannosaurus-turtle.ts.net
        description: "AI agent"
        icon: hermes.png
        siteMonitor: https://hermes.tyrannosaurus-turtle.ts.net
