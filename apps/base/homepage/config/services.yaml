- Media:
    - jellyfin:
        href: https://jellyfin.tyrannosaurus-turtle.ts.net
        description: "Stream media"
        icon: jellyfin.png
        siteMonitor: https://jellyfin.tyrannosaurus-turtle.ts.net
        widget:
            type: jellyfin
            url: http://jellyfin.saga.svc.cluster.local
            key: "{{HOMEPAGE_VAR_JELLYFIN_API_KEY}}"
            version: 1
