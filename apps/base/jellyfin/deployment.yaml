# yaml-language-server: $schema=https://kubernetesjsonschema.dev/v1.14.0/deployment-apps-v1.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  labels:
    app: jellyfin
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      # Jellyfin's named configuration (encoding.xml / system.xml) is loaded only
      # via XmlSerializer.DeserializeFromFile -- the JELLYFIN_* env vars feed
      # ASP.NET host configuration, not IConfigurationManager, so transcoding
      # settings cannot be set by env var. Apply them to /config before the
      # server starts instead. Idempotent: rewriting the same values is a no-op
      # on every subsequent restart.
      initContainers:
        - name: apply-encoding-config
          image: busybox:1.37.0
          command: ["/bin/sh", "/scripts/patch-system-xml.sh"]
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: encoding-src
              mountPath: /encoding-src
            - name: encoding-script
              mountPath: /scripts
      containers:
        - name: jellyfin
          image: ghcr.io/linuxserver/jellyfin:10.11.11 # {"$imagepolicy": "flux-system:jellyfin"}
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 200m
              memory: 1Gi
            limits:
              cpu: 2000m
              # Sized from measurement, not guesswork. With VAAPI transcoding
              # (see apps/configMaps/jellyfin) the pod's worst observed working
              # set from synthetic load is ~1.2 GiB: 5 concurrent h264_vaapi
              # transcodes (94 MiB each) plus three scoped library scans.
              #
              # That was NOT the real worst case. 24h at 2 GiB showed the ceiling
              # reached exactly twice (memory.events: max 2, oom_kill 0), caused
              # not by viewers but by Jellyfin's own deterministic nightly
              # maintenance -- Extract Chapter Images (00:00Z), Generate Trickplay
              # Images (01:00Z), Media Segment Scan (01:38Z), Scan Media Library
              # (01:39Z). That cycle recurs every night regardless of usage, and
              # the synthetic test never included it. No harm resulted (the kernel
              # reclaimed page cache rather than killing the pod) but it cost real
              # churn: pgscan/pgsteal ~1.24M, workingset_refault_file ~126k.
              #
              # 3 GiB clears that nightly peak while still sitting ~2.6 GiB below
              # the 5 GiB this pod needed before VAAPI transcoding (its lifetime
              # high-water mark was 2.96 GiB while software encoding with libx264).
              # Note only the 1Gi request is actually withheld from the scheduler;
              # this limit is a ceiling, so the extra GiB costs the node nothing
              # until it is genuinely needed.
              memory: 3Gi
          ports:
            - containerPort: 8096
              protocol: TCP
              name: http
            - containerPort: 7359
              protocol: UDP
            - containerPort: 1900
              protocol: UDP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 3
            initialDelaySeconds: 15
            periodSeconds: 30
          envFrom:
            - configMapRef:
                name: linuxserver-common
                optional: false
          volumeMounts:
            - mountPath: /config
              name: config
            - mountPath: /data
              name: media
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: jellyfin-config
        - name: media
          persistentVolumeClaim:
            claimName: media
        # Source of truth for encoding.xml; defaultMode 0444.
        - name: encoding-src
          configMap:
            name: jellyfin-encoding-config
            items:
              - key: encoding.xml
                path: encoding.xml
        - name: encoding-script
          configMap:
            name: jellyfin-encoding-config
            items:
              - key: patch-system-xml.sh
                path: patch-system-xml.sh
            defaultMode: 0555
