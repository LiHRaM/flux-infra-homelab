# yaml-language-server: $schema=https://kubernetesjsonschema.dev/v1.14.0/deployment-apps-v1.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  labels:
    app: jellyfin
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      # Jellyfin's named configuration (encoding.xml / system.xml) is loaded only
      # via XmlSerializer.DeserializeFromFile -- the JELLYFIN_* env vars feed
      # ASP.NET host configuration, not IConfigurationManager, so transcoding
      # settings cannot be set by env var. Apply them to /config before the
      # server starts instead. Idempotent: rewriting the same values is a no-op
      # on every subsequent restart.
      initContainers:
        - name: apply-encoding-config
          image: busybox:1.37.0
          command: ["/bin/sh", "/scripts/patch-system-xml.sh"]
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: encoding-src
              mountPath: /encoding-src
            - name: encoding-script
              mountPath: /scripts
      containers:
        - name: jellyfin
          image: ghcr.io/linuxserver/jellyfin:10.11.11 # {"$imagepolicy": "flux-system:jellyfin"}
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              # Sized from measurement, not guesswork. With VAAPI transcoding
              # (see apps/configMaps/jellyfin) the pod's worst observed working
              # set from synthetic load is ~1.2 GiB: 5 concurrent h264_vaapi
              # transcodes (94 MiB each) plus three scoped library scans.
              #
              # That was NOT the real worst case. 24h at 2 GiB showed the ceiling
              # reached exactly twice (memory.events: max 2, oom_kill 0), caused
              # not by viewers but by Jellyfin's own deterministic nightly
              # maintenance -- Extract Chapter Images (00:00Z), Generate Trickplay
              # Images (01:00Z), Media Segment Scan (01:38Z), Scan Media Library
              # (01:39Z). That cycle recurs every night regardless of usage, and
              # the synthetic test never included it. No harm resulted (the kernel
              # reclaimed page cache rather than killing the pod) but it cost real
              # churn: pgscan/pgsteal ~1.24M, workingset_refault_file ~126k.
              #
              # At 3 GiB the ceiling was still being hit, and by the wrong
              # component. Measured live from inside the pod:
              #   memory.current 3215032320 / memory.max 3221225472  (99.8 %)
              #   memory.events: max 4, oom 0, oom_kill 0
              #   memory.stat: file 2343849984, anon 683069440, shmem 193896448
              #   pgscan 41826984 / pgsteal 41811981
              # So 2.34 GB of the 3 GiB was NFS page cache for the media mount
              # and only 683 MB was Jellyfin's own heap -- the cgroup was pinned
              # at its ceiling by reclaimable cache, and the kernel was
              # thrashing it (41.8M page scans against 41.8M steals, i.e. it
              # scanned and immediately discarded, a pure loss) while the app
              # read the same file repeatedly. Nothing was OOM-killed, so the
              # pod stayed "Running" the whole time.
              #
              # 6 GiB gives the cache room to be a cache instead of a thrash
              # target, and clears the nightly-maintenance peak with margin.
              # Only the 2Gi request is withheld from the scheduler; the limit
              # is a ceiling, so the extra GiB costs the node nothing until it
              # is genuinely needed.
              memory: 6Gi
              # CPU 2 -> 4. The node has 4 cores and the pod was throttled for
              # 804 s of its 21,167 s of CPU time (nr_throttled 37045 of 826694
              # periods). The dominant cause was not viewers but three
              # concurrent WHOLE-FILE transcodes of a 19h45m audiobook
              # (2026-10-26 01:31-01:35, FFmpeg.Transcode logs, -threads 0 =>
              # every core, ~860 MB read each). Those saturate the limit and
              # starve Jellyfin's request thread pool, which is what a client
              # experiences as a freeze. 4 lets the transcode pool make
              # progress without starving the request path.
              cpu: 4000m
          ports:
            - containerPort: 8096
              protocol: TCP
              name: http
            - containerPort: 7359
              protocol: UDP
            - containerPort: 1900
              protocol: UDP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 5
            initialDelaySeconds: 30
            periodSeconds: 60
            # /health is served by the same thread pool that runs library scans.
            # With the 1s default (no timeoutSeconds) a full music-library rescan
            # makes it miss the deadline, the kubelet kills a healthy-but-busy
            # server, and it restarts straight back into the same scan -- a crash
            # loop that never converges. 10s tolerates the scan and still catches
            # a genuinely wedged process.
            timeoutSeconds: 10
          envFrom:
            - configMapRef:
                name: linuxserver-common
                optional: false
          volumeMounts:
            - mountPath: /config
              name: config
            - mountPath: /data
              name: media
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: jellyfin-config
        - name: media
          persistentVolumeClaim:
            claimName: media
        # Source of truth for encoding.xml; defaultMode 0444.
        - name: encoding-src
          configMap:
            name: jellyfin-encoding-config
            items:
              - key: encoding.xml
                path: encoding.xml
        - name: encoding-script
          configMap:
            name: jellyfin-encoding-config
            items:
              - key: patch-system-xml.sh
                path: patch-system-xml.sh
            defaultMode: 0555
