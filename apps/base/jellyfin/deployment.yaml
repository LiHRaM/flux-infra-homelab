# yaml-language-server: $schema=https://kubernetesjsonschema.dev/v1.14.0/deployment-apps-v1.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  labels:
    app: jellyfin
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      # Jellyfin's named configuration (encoding.xml / system.xml) is loaded only
      # via XmlSerializer.DeserializeFromFile -- the JELLYFIN_* env vars feed
      # ASP.NET host configuration, not IConfigurationManager, so transcoding
      # settings cannot be set by env var. Apply them to /config before the
      # server starts instead. Idempotent: rewriting the same values is a no-op
      # on every subsequent restart.
      initContainers:
        - name: apply-encoding-config
          image: busybox:1.37.0
          command: ["/bin/sh", "/scripts/patch-system-xml.sh"]
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: encoding-src
              mountPath: /encoding-src
            - name: encoding-script
              mountPath: /scripts
      containers:
        - name: jellyfin
          image: ghcr.io/linuxserver/jellyfin:10.11.11 # {"$imagepolicy": "flux-system:jellyfin"}
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 200m
              memory: 1Gi
            limits:
              cpu: 2000m
              # Sized from measurement, not guesswork. With VAAPI transcoding
              # (see apps/configMaps/jellyfin) the pod's worst observed working
              # set is ~1.2 GiB: 5 concurrent h264_vaapi transcodes (94 MiB each)
              # plus three scoped library scans, sampled at 2 Hz -- mean 1.05 GiB,
              # peak 1.21 GiB, of which only ~0.5 GiB was unreclaimable anon and
              # the rest reclaimable page cache and transcode tmpfs. 2 GiB leaves
              # ~65% headroom over that synthetic extreme while returning 3 GiB
              # to the node. Before the VAAPI change the same pod carried a
              # 2.96 GiB lifetime high-water mark, which is why 2 GiB was not
              # previously safe. Revisit after a week of real usage.
              memory: 2Gi
          ports:
            - containerPort: 8096
              protocol: TCP
              name: http
            - containerPort: 7359
              protocol: UDP
            - containerPort: 1900
              protocol: UDP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 3
            initialDelaySeconds: 15
            periodSeconds: 30
          envFrom:
            - configMapRef:
                name: linuxserver-common
                optional: false
          volumeMounts:
            - mountPath: /config
              name: config
            - mountPath: /data
              name: media
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: jellyfin-config
        - name: media
          persistentVolumeClaim:
            claimName: media
        # Source of truth for encoding.xml; defaultMode 0444.
        - name: encoding-src
          configMap:
            name: jellyfin-encoding-config
            items:
              - key: encoding.xml
                path: encoding.xml
        - name: encoding-script
          configMap:
            name: jellyfin-encoding-config
            items:
              - key: patch-system-xml.sh
                path: patch-system-xml.sh
            defaultMode: 0555
